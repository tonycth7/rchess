[package]
name        = "rchess"
version     = "0.8.0"
edition     = "2021"
authors     = ["RChess TUI"]
description = "Terminal chess — multiplayer, puzzles, PGN, analysis, mouse"

[[bin]]
name = "rchess"
path = "src/main.rs"

[[bin]]
name = "rchess-server"
path = "server/main.rs"

[dependencies]
# TUI client deps
ratatui   = "0.29"
crossterm = "0.28"

# Server deps (Tokio async runtime)
tokio = { version = "1", features = ["full"] }

[lints.rust]
dead_code = "warn"
