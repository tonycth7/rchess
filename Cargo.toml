[package]
name        = "rchess"
version     = "0.7.0"
edition     = "2021"
authors     = ["RChess TUI"]
description = "Terminal chess — v0.7 with PNG export, opening book, PGN, replay, analysis, mouse"

[[bin]]
name = "rchess"
path = "src/main.rs"

[dependencies]
ratatui   = "0.29"
crossterm = "0.28"

# Suppress false-positive dead_code warnings on pub fields used only in ui.rs
[lints.rust]
dead_code = "warn"
