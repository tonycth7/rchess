[package]
name        = "rchess"
version     = "0.7.3"
edition     = "2021"
authors     = ["RChess TUI"]
description = "Terminal chess — v0.8 with puzzles, PGN import, FEN import, analysis, mouse"

[[bin]]
name = "rchess"
path = "src/main.rs"

[dependencies]
ratatui   = "0.30"
crossterm = "0.29"
serde     = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "3", default-features = false, features = ["native-tls"] }

[lints.rust]
dead_code = "warn"
